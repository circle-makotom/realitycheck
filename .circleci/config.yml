version: 2

resource_job_defaults: &resource_job_defaults
  docker:
    - image: 'cimg/base:2021.02-20.04'
  steps:
    - run:
        name: verify required Environment Variables
        command: |
          if [ -z "${CIRCLE_HOSTNAME}" -o -z "${CIRCLE_TOKEN}" ];then
            echo "You must provide 2 Environment Variables in project settings for this job to run."
            echo "CIRCLE_HOSTNAME: Should be the scheme://domain of your install. \"https://ci.example.com\""
            echo "CIRCLE_TOKEN: Should be the API Key of an admin or project level with Scope:All"
            exit 1
          fi
    - run:
        name: verify that job ran with the requested resource_class option
        command: |
          curl -k \
          "${CIRCLE_HOSTNAME%/}/api/v1.1/project/github/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME/$CIRCLE_BUILD_NUM?\
          circle-token=$CIRCLE_TOKEN" | \
          jq '.picard.resource_class.class' | grep $CIRCLE_JOB

remote_docker_defaults: &remote_docker_defaults
  docker: [{image: 'docker:17.06-git'}]

basic_docker_build: &basic_docker_build
  name: "Build a really basic docker image"
  command: |
    dockerfile=Dockerfile
    echo "FROM alpine:latest" > $dockerfile
    echo "RUN echo hello" >> $dockerfile
    docker build -f $dockerfile --tag throwaway:$CIRCLE_BUILD_NUM .
    docker run --rm throwaway:$CIRCLE_BUILD_NUM

contexts_defaults: &contexts_defaults
  docker: [{image: 'alpine:latest'}]
  working_directory: /a/contexts/test

workspaces_defaults: &workspaces_defaults
  docker: [{image: 'circleci/node:latest'}]
  working_directory: ~/foo/bar

jobs:
  # resource class jobs
  small: # 1 vCPU, 2GB RAM
    <<: *resource_job_defaults
    resource_class: small

  medium: # 2 vCPUs, 4GB RAM
    <<: *resource_job_defaults
    resource_class: medium

  medium+: # 3 vCPUs, 6GB RAM
    <<: *resource_job_defaults
    resource_class: medium+

  large: # 4 vCPUs, 8GB RAM
    <<: *resource_job_defaults
    resource_class: large

  xlarge: # 8 vCPUs, 16GB RAM
    <<: *resource_job_defaults
    resource_class: xlarge

  # vm jobs
  machine:
    machine: true
    steps:
      - run:
          <<: *basic_docker_build
      - run: |
          echo $SLEEP
          date
          sleep $SLEEP
          date
          echo 'Done sleeping.'
    environment:
      SLEEP: 1

  remote_docker:
    <<: *remote_docker_defaults
    steps:
      - run: which docker
      - run: docker -v
      - setup_remote_docker
      - run:
          <<: *basic_docker_build
      - run: docker version

  docker_layer_caching:
    <<: *remote_docker_defaults
    steps:
      - run: which docker
      - run: docker -v
      - setup_remote_docker:
          docker_layer_caching: true
      - run:
          <<: *basic_docker_build
      - run: docker version

  machine_dlc:
    machine:
      docker_layer_caching: true
    steps:
      - run: which docker
      - run: docker -v
      - run:
          <<: *basic_docker_build
      - run: docker version

  # feature jobs
  contexts:
    <<: *contexts_defaults
    steps:
      - run: env | grep CONTEXT_END_TO_END_TEST_VAR

  multi-contexts:
    <<: *contexts_defaults
    steps:
      - run: env | grep MULTI_CONTEXT_END_TO_END_VAR

  write_workspace:
    <<: *workspaces_defaults
    steps:
      - run: mkdir stuff
      - run: echo 5 >./stuff/thing
      - persist_to_workspace:
          root: .
          paths:
            - stuff

  read_workspace:
    <<: *workspaces_defaults
    steps:
      - attach_workspace:
           at: ./attached
      - run: |
          if [[ $(< ./attached/stuff/thing) != '5' ]]; then
            echo 'Sadness, the value is not what we expected, so the workspace write/read did not work'
            exit 1
          else
            echo 'Yay, value matches'
            exit 0
          fi

  save_and_restore_cache:
    docker:
      - image: circleci/python
    working_directory: ~/realitycheck
    steps:
      # Skipping checkout to avoid communicating with GH.com
      # - checkout

      - run: mkdir -p stuff
      - run: echo 5 >./stuff/thing

      - save_cache:
          key: v3-file-cache-{{ .BuildNum }}
          paths:
            - ./stuff/thing

      - run: rm -rf ./stuff/thing
      - run: sleep 5

      - restore_cache:
            keys:
              - v3-file-cache-{{ .BuildNum }}

      - run: |
            if [[ $(< stuff/thing) != '5' ]]; then
              exit 1
            else
              echo "The cache was populated"
            fi

  artifacts_test_results:
    docker:
      - image: python:3.6.0
    working_directory: ~/realitycheck
    steps:
      # Skipping checkout to avoid communicating with GH.com
      # - checkout

      - run:
          name: Creating Dummy Artifacts
          command: |
            echo "my artifact file" > /tmp/artifact-1.txt;
            mkdir /tmp/artifacts;
            echo "my artifact files in a dir" > /tmp/artifacts/artifact-2.txt;

            # Creating test data on the fly
            mkdir -p test-results
            cat <<EOD > test-results/test-results.xml
            <testsuite name="TAP Tests" tests="35" failures="0" errors="0" skipped="0" timestamp="Tue, 26 Sep 2017 20:35:21 GMT" time="12.208">
            <testcase classname="" name="client › modules › App › AppReducer › action for TOGGLE_ADD_POST is working" time="0"/>
            <testcase classname="" name="client › modules › App › AppReducer › getShowAddPost selector" time="0"/>
            <testcase classname="" name="client › modules › Intl › IntlActions › should return the correct type for switchLanguage" time="0"/>
            <testcase classname="" name="client › modules › App › AppActions › should return the correct type for toggleAddPost" time="0"/>
            <testcase classname="" name="client › modules › App › App › renders properly" time="0"/>
            <testcase classname="" name="client › modules › Intl › IntlReducer › action for SWITCH_LANGUAGE is working" time="0"/>
            <testcase classname="" name="client › modules › Post › PostReducer › action for ADD_POST is working" time="0"/>
            <testcase classname="" name="client › modules › Post › PostReducer › action for DELETE_POST is working" time="0"/>
            <testcase classname="" name="client › modules › Post › PostReducer › action for ADD_POSTS is working" time="0"/>
            <testcase classname="" name="client › modules › Post › PostReducer › getPosts selector" time="0"/>
            <testcase classname="" name="client › modules › Post › PostReducer › getPost selector" time="0"/>
            <testcase classname="" name="client › modules › Post › PostActions › should return the correct type for addPost" time="0"/>
            <testcase classname="" name="client › modules › Post › PostActions › should return the correct type for deletePost" time="0"/>
            <testcase classname="" name="client › modules › Post › PostActions › should return the correct type for addPosts" time="0"/>
            <testcase classname="" name="client › modules › App › Components › Header › renders the header properly" time="0"/>
            <testcase classname="" name="client › modules › App › Components › Header › doesn't add post in pages other than home" time="0"/>
            <testcase classname="" name="client › modules › Post › components › PostCreateWidget › renders properly" time="0"/>
            <testcase classname="" name="client › modules › App › Components › Header › toggleAddPost called properly" time="0"/>
            <testcase classname="" name="client › modules › Post › components › PostList › renders the list" time="0"/>
            <testcase classname="" name="client › modules › App › Components › Footer › renders the footer properly" time="0"/>
            <testcase classname="" name="client › modules › Post › components › PostListItem › renders properly" time="0"/>
            <testcase classname="" name="client › modules › Post › components › PostCreateWidget › hide when showAddPost is false" time="0"/>
            <testcase classname="" name="client › modules › Post › components › PostCreateWidget › has correct props" time="0"/>
            <testcase classname="" name="client › modules › Post › components › PostListItem › has correct props" time="0"/>
            <testcase classname="" name="client › modules › Post › components › PostCreateWidget › calls addPost" time="0"/>
            <testcase classname="" name="client › modules › Post › components › PostListItem › calls onDelete" time="0"/>
            <testcase classname="" name="client › modules › Post › components › PostCreateWidget › empty form doesn't call addPost" time="0"/>
            <testcase classname="" name="client › modules › App › App › calls componentDidMount" time="0"/>
            <testcase classname="" name="client › modules › App › App › calling toggleAddPostSection dispatches toggleAddPost" time="0"/>
            <testcase classname="" name="client › util › apiCaller › method defaults to GET" time="0"/>
            <testcase classname="" name="client › util › apiCaller › sends the body" time="0"/>
            <testcase classname="" name="client › util › apiCaller › returns the error" time="0"/>
            <testcase classname="" name="server › models › post › Should send correct data when queried against a cuid" time="0"/>
            <testcase classname="" name="server › models › post › Should correctly add a post" time="0"/>
            <testcase classname="" name="server › models › post › Should correctly delete a post" time="0"/>
            </testsuite>
            EOD

      - store_artifacts:
          path: /tmp/artifact-1.txt
          destination: artifact-file.txt

      - store_artifacts:
          path: /tmp/artifacts

      - store_test_results:
          path: test-results

workflows:
  version: 2
  resource_class_jobs:
    jobs:
      - small
      - medium
      - medium+
      - large
      - xlarge

  vm_jobs:
    jobs:
      - machine
      - remote_docker
      - docker_layer_caching
      - machine_dlc

  feature_jobs:
    jobs:
      - save_and_restore_cache
      - contexts:
          context: org-global
      - multi-contexts:
          context: individual-local
      - write_workspace
      - read_workspace:
          requires:
            - write_workspace
      - artifacts_test_results

